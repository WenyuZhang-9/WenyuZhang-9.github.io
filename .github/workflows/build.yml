name: Build static academic website

on:
  pull_request:
    branches: ['main']
  workflow_call:
    outputs:
      artifact-id:
        description: 'The ID of the uploaded artifact'
        value: ${{ jobs.build.outputs.artifact-id }}
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp research.html _site/
          cp publications.html _site/
          cp cv.html _site/
          cp .nojekyll _site/ || touch _site/.nojekyll
          cp -R assets _site/

      - name: Upload static artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
